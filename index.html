<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deputation Portal</title>
  <meta
    name="description"
    content="Central Government Deputation Vacancies Dashboard with searchable vacancies, ministry-wise insights, rules, and updates."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <script>(function(){try{var t=localStorage.getItem('deputation_theme_v1')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
  <!-- Desktop: latest styles. Mobile (<=768px): the 2-days-ago (June-2) stylesheet,
       a known-good stacked layout, loaded via media attribute so only one applies. -->
  <link rel="stylesheet" href="style.css?v=ms16" media="(min-width: 768.01px)">
  <link rel="stylesheet" href="style-legacy.css?v=3" media="(max-width: 768px)">
  <link rel="stylesheet" href="navbar.css">

  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <nav class="top-nav">
    <a href="/index.html" class="active">Home</a>
    <a href="/rules.html">Rules</a>
    <a href="/Rules/faq.html">FAQs</a>
    <a href="/defex.html">DeFeX</a>
    <a href="/report-vacancy.html">Report Vacancy</a>
    <a href="/contact.html">Contact</a>
    <a href="/my-deputation.html">My Deputation</a>
  </nav>

  <div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <div class="app-container">
    <header class="app-header">
      <div class="header-logo">
        <i data-lucide="building-2"></i>
        <h1><span class="gradient-text">DEPUTATION</span> VACANCIES</h1>
      </div>

      <div class="header-actions">
        <button id="favBtn" class="icon-btn" title="My Watchlist" aria-label="My Watchlist">
          <i data-lucide="heart"></i>
          <span id="favCount" class="fav-count">0</span>
        </button>

        <button id="themeToggle" class="icon-btn" title="Toggle Theme" aria-label="Toggle Theme">
          <i data-lucide="moon"></i>
        </button>
      </div>
    </header>

    <main class="main-layout">
      <aside class="filters-sidebar glass-panel">
        <div class="filters-header">
          <h2><i data-lucide="filter"></i> Filters</h2>
          <button id="clearFiltersBtn" class="text-btn">Clear All</button>
        </div>

        <div class="filter-group">
          <label for="searchPost">Search</label>
          <div class="input-icon">
            <i data-lucide="search"></i>
            <input type="text" id="searchPost" placeholder="Post, dept, keywords...">
          </div>
        </div>

        <div class="filter-group">
          <label for="filterMyPayLevel">My Pay Level</label>
          <select id="filterMyPayLevel">
            <option value="">Any Level</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filterExperience">My Years of Experience</label>
          <select id="filterExperience">
            <option value="">Any</option>
          </select>
          <p style="margin:0.4rem 0 0;font-size:0.72rem;line-height:1.3;color:var(--text-muted);text-transform:none;letter-spacing:0;font-weight:400;">Years at your current level. Refines "My Pay Level" to posts you're eligible for.</p>
        </div>

        <div class="filter-group">
          <label for="filterLevel">Pay Level</label>
          <select id="filterLevel">
            <option value="">All Levels</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filterMinistry">Ministry</label>
          <select id="filterMinistry">
            <option value="">All Ministries</option>
          </select>
        </div>

        <div class="filter-group">
          <label id="filterLocationLbl">Location</label>
          <div class="ms" id="filterLocationMS">
            <button type="button" class="ms-trigger" id="filterLocationBtn"
                    aria-haspopup="listbox" aria-expanded="false" aria-labelledby="filterLocationLbl">
              <span class="ms-trigger-label">All Locations</span>
              <svg class="ms-caret" viewBox="0 0 24 24" aria-hidden="true"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </button>
            <div class="ms-panel" id="filterLocationPanel" hidden role="dialog" aria-label="Select locations">
              <header class="ms-panel-head">
                <div class="ms-search-wrap">
                  <svg class="ms-search-icon" viewBox="0 0 24 24" aria-hidden="true"
                       fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
                  </svg>
                  <input type="search" class="ms-search" placeholder="Search locations…" aria-label="Search locations">
                </div>
                <button type="button" class="ms-close" data-ms-done aria-label="Close">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
              </header>
              <p class="ms-hint">Click a location to select it · click again to deselect</p>
              <ul class="ms-list" id="filterLocationList" role="listbox" aria-multiselectable="true"></ul>
              <div class="ms-empty" hidden>No matches</div>
              <footer class="ms-panel-foot">
                <span class="ms-count" data-ms-count>0 selected</span>
                <div class="ms-foot-actions">
                  <button type="button" class="ms-action" data-ms-none>Clear all</button>
                  <button type="button" class="ms-action ms-action--primary" data-ms-done>Done</button>
                </div>
              </footer>
            </div>
          </div>
        </div>

        <div class="filter-group">
          <label for="filterStatus">Status</label>
          <select id="filterStatus">
            <option value="">All</option>
            <option value="Active" selected>Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

      </aside>

      <section class="dashboard-content">
        <div class="kpi-grid" id="kpiGrid"></div>

        <div class="top-toolbar">
          <div class="toolbar-line toolbar-line-filters">
            <div class="results-count" id="resultsCount">Loading vacancies...</div>
            <div id="activeFilters" class="active-filters"></div>
            <div class="quick-filters-bar" id="quickFiltersBar"></div>

            <div class="view-toggles">
              <button id="btnTableView" class="view-btn active" title="Table View" aria-label="Table View">
                <i data-lucide="table-2"></i>
              </button>

              <button id="btnCardView" class="view-btn" title="Card View" aria-label="Card View">
                <i data-lucide="layout-grid"></i>
              </button>
            </div>
          </div>
        </div>

        <div id="dataContainer" class="data-container view-table"></div>
      </section>
    </main>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content glass-panel">
      <button id="closeModal" class="modal-close" aria-label="Close">
        <i data-lucide="x"></i>
      </button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="config.js?v=sb1"></script>
  <script src="enrich.js?v=sb7"></script>
  <script src="app.js?v=ms17"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>India Map — Central Deputation Vacancies | Deputations</title>
  <link rel="canonical" href="https://alldeputations.com/india-map">
  <link rel="stylesheet" href="/style.css?v=ms73">
  <link rel="stylesheet" href="/india-map.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body class="map-entry">
  <nav class="top-nav" aria-label="Primary site navigation">
    <a class="nav-brand" href="/index.html" aria-label="Back to home" title="Deputations home">
      <img class="nav-brand-mark nav-brand-v2" src="/assets/brand/v2-logo.png" alt="V²" width="32" height="32" decoding="async">
    </a>
    <div class="nav-links">
      <a href="/index.html">Home</a>
      <a href="/india-map" class="active">India Map</a>
      <a href="/rules.html">Rules</a>
      <a href="/faq.html">FAQs</a>
      <a href="/defex.html">DeFeX</a>
      <a href="/report-vacancy.html">Report Vacancy</a>
      <a href="/contact.html">Contact</a>
      <a href="/my-deputation.html">My Deputation</a>
    </div>
  </nav>

  <main id="map-view">
    <div class="map-container" id="mapContainer">
      <canvas id="particleCanvas" class="map-particles" aria-hidden="true"></canvas>
      <div class="map-header">
        <a href="/index.html" class="map-back-btn" aria-label="Back to Home">
          <span>‹</span>
          <span>Back to Home</span>
        </a>
        <div class="map-title">
          <h2>Explore India</h2>
          <p class="map-subtitle" id="mapSubtitle">Interactive vacancy map</p>
        </div>
        <div class="map-counter" id="mapCounter">
          <span class="map-counter-label">Active Vacancies</span>
          <span class="map-counter-value" id="mapCounterValue">—</span>
        </div>
      </div>
      <div class="map-svg-wrap" id="mapSvgWrap"></div>
      <div class="map-tooltip" id="mapTooltip" hidden>
        <div class="map-tooltip-name" id="mapTooltipName"></div>
        <div class="map-tooltip-count" id="mapTooltipCount"></div>
        <div class="map-tooltip-meta" id="mapTooltipMeta"></div>
      </div>
      <div class="map-controls">
        <div class="map-filters">
          <button class="map-filter-btn active" data-filter="all">All</button>
          <button class="map-filter-btn" data-filter="functional">Functional</button>
          <button class="map-filter-btn" data-filter="education">Education</button>
        </div>
        <div class="map-zoom-controls">
          <button id="zoomInBtn" class="map-zoom-btn" aria-label="Zoom in">+</button>
          <button id="zoomOutBtn" class="map-zoom-btn" aria-label="Zoom out">&minus;</button>
          <button id="zoomResetBtn" class="map-zoom-btn" aria-label="Reset view">&#8962;</button>
        </div>
      </div>
    </div>
  </main>

  <script src="/config.js"></script>
  <script src="/enrich.js"></script>
  <script src="/india-map-data.js"></script>
  <script src="/india-map-view.js"></script>
</body>
</html>

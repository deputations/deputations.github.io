<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>India Map — AllDeputations</title>
  <meta name="description" content="Explore government job vacancies across India — state and district level drill-down with real-time filtering." />
  <link rel="canonical" href="https://alldeputations.com/india-map" />

  <!-- identity -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">

  <!-- og/twitter -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Deputations">
  <meta property="og:title" content="Deputations — India Map">
  <meta property="og:description" content="Explore government job vacancies across India — interactive map with state and district level drill-down.">
  <meta property="og:url" content="https://alldeputations.com/india-map">
  <meta property="og:image" content="https://alldeputations.com/assets/brand/og-home.png?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Deputations — India Map">
  <meta name="twitter:description" content="Explore government job vacancies across India — interactive map with state and district level drill-down.">
  <meta name="twitter:image" content="https://alldeputations.com/assets/brand/og-home.png?v=2">

  <!-- production font stack (+ Lora for empty states) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&family=Lora:ital,wght@1,400;1,500&display=swap" rel="stylesheet" />

  <!-- production navbar CSS -->
  <link rel="stylesheet" href="/navbar.css?v=7">

  <!-- liquid-glass optical glass -->
  <link rel="stylesheet" href="/liquid-glass.css?v=2" />

  <!-- page CSS -->
  <link rel="stylesheet" href="css/india-map/main.css?v=9" />
</head>
<body class="filters-collapsed">

<!-- ===== OVERLAYS (outside ad-page so fixed positioning is never overridden by flex) ===== -->
<button class="ad-back-btn" id="btn-back" hidden aria-label="Back to India map">
  <i class="ph ph-arrow-left"></i> India Map
</button>

<aside class="ad-summary lg-surface" id="summary-card" aria-live="polite">
  <div class="ad-summary-title" id="summary-title">All India</div>
  <div class="ad-summary-count" id="summary-count">—</div>
  <div class="ad-summary-label" id="summary-label">active vacancies</div>
</aside>

<div class="ad-hud visible lg-surface" id="hud">
  <div class="ad-view-toggle" role="group" aria-label="View mode">
    <button class="ad-view-btn active" data-view="map" aria-pressed="true">
      <i class="ph ph-map-trifold"></i> <span class="btn-label">Map</span>
    </button>
    <button class="ad-view-btn" data-view="functional" aria-pressed="false">
      <i class="ph ph-tree-structure"></i> <span class="btn-label">Functional</span>
    </button>
    <button class="ad-view-btn" data-view="education" aria-pressed="false">
      <i class="ph ph-graduation-cap"></i> <span class="btn-label">Education</span>
    </button>
  </div>

  <div class="ad-hud-sep"></div>

  <button class="ad-hud-filter-btn" id="btn-filter" aria-label="Open filters">
    <i class="ph ph-funnel"></i> Filter
  </button>

  <div class="ad-hud-sep"></div>

  <div class="ad-hud-zoom" role="group" aria-label="Zoom">
    <button class="ad-hud-zoom-btn" id="btn-zoom-out" aria-label="Zoom out">
      <i class="ph ph-minus"></i>
    </button>
    <button class="ad-hud-zoom-btn" id="btn-zoom-in" aria-label="Zoom in">
      <i class="ph ph-plus"></i>
    </button>
    <button class="ad-hud-zoom-btn" id="btn-zoom-reset" aria-label="Reset zoom">
      <i class="ph ph-corners-out"></i>
    </button>
  </div>
</div>

<div class="ad-filter-active-bar" id="active-filters-bar" hidden></div>

<div class="ad-sheet-overlay" id="sheet-overlay"></div>

<section class="ad-sheet lg-surface" id="results-sheet" aria-label="Job listings" hidden>
  <div class="ad-sheet-header">
    <div class="ad-sheet-title-group">
      <h2 class="ad-sheet-title" id="sheet-title">Jobs</h2>
      <div class="ad-sheet-breadcrumb" id="sheet-breadcrumb"></div>
    </div>
    <button class="ad-sheet-close" id="btn-sheet-close" aria-label="Close results">
      <i class="ph ph-x"></i>
    </button>
  </div>
  <div class="ad-sheet-body" id="sheet-body"></div>
</section>

<div class="ad-filter-drawer lg-surface" id="filter-drawer" role="dialog" aria-modal="true" aria-label="Filters">
  <div class="ad-filter-header">
    <h3>Filters</h3>
    <button class="ad-filter-close" id="btn-close-filter" aria-label="Close filters">
      <i class="ph ph-x"></i>
    </button>
  </div>
  <div class="ad-filter-body" id="filter-body"></div>
  <div class="ad-filter-actions">
    <button class="ad-btn-ghost" id="btn-clear-filters">Clear All</button>
    <button class="ad-btn-primary" id="btn-apply-filters">Apply</button>
  </div>
</div>

<!-- ===== MAIN PAGE (navbar + map stage only) ===== -->
<div class="ad-page" id="app">
  <!-- production navbar (identical to all other pages) -->
  <nav class="top-nav" aria-label="Primary site navigation">
      <a class="nav-brand" href="/index.html" aria-label="About this project" title="About this project">
        <img class="nav-brand-mark nav-brand-v2" src="/assets/brand/v2-logo.png" alt="V² — V Square" width="32" height="32" decoding="async">
      </a>
      <div class="nav-links">
        <a href="/index.html">Home</a>
        <a href="/india-map" class="active" aria-current="page">India Map</a>
        <a href="/rules.html">Rules</a>
        <a href="/faq.html">FAQs</a>
        <a href="/defex.html">DeFeX</a>
        <a href="/report-vacancy.html">Report Vacancy</a>
        <a href="/contact.html">Contact</a>
        <a href="/my-deputation.html">My Deputation</a>
      </div>
      <span class="nav-updated" id="dataUpdated" hidden></span>
    </nav>

    <!-- MAP STAGE -->
    <div class="ad-map-stage" id="map-stage">
      <div class="ad-map-container" id="map-container">
        <canvas class="ad-aurora" id="aurora-canvas" aria-hidden="true"></canvas>
        <div id="india-map-svg">
          <!-- SVG injected by map-view.js -->
        </div>
        <canvas id="particle-canvas"></canvas>
      </div>

      <!-- Empty state overlay -->
      <div class="ad-empty-state" id="empty-state" hidden>
        <div class="ad-empty-icon">&#9670;</div>
        <div class="ad-empty-title">No Active Vacancies</div>
        <div class="ad-empty-subtitle">Check back soon — new postings appear regularly</div>
      </div>

      <!-- Functional / Education card views -->
      <div class="ad-cards-view" id="functional-view">
        <div class="ad-cards-grid" id="functional-grid"></div>
      </div>
      <div class="ad-cards-view" id="education-view">
        <div class="ad-cards-grid" id="education-grid"></div>
      </div>
    </div>

    <!-- BACK BUTTON -->
    <button class="ad-back-btn" id="btn-back" hidden aria-label="Back to India map">
      <i class="ph ph-arrow-left"></i> India Map
    </button>

    <!-- SUMMARY CARD (top-right) -->
    <aside class="ad-summary lg-surface" id="summary-card" aria-live="polite">
      <div class="ad-summary-title" id="summary-title">All India</div>
      <div class="ad-summary-count" id="summary-count">—</div>
      <div class="ad-summary-label" id="summary-label">active vacancies</div>
    </aside>

    <!-- HUD BAR -->
    <div class="ad-hud visible lg-surface" id="hud">
      <div class="ad-view-toggle" role="group" aria-label="View mode">
        <button class="ad-view-btn active" data-view="map" aria-pressed="true">
          <i class="ph ph-map-trifold"></i> <span class="btn-label">Map</span>
        </button>
        <button class="ad-view-btn" data-view="functional" aria-pressed="false">
          <i class="ph ph-tree-structure"></i> <span class="btn-label">Functional</span>
        </button>
        <button class="ad-view-btn" data-view="education" aria-pressed="false">
          <i class="ph ph-graduation-cap"></i> <span class="btn-label">Education</span>
        </button>
      </div>

      <div class="ad-hud-sep"></div>

      <button class="ad-hud-filter-btn" id="btn-filter" aria-label="Open filters">
        <i class="ph ph-funnel"></i> Filter
      </button>

      <div class="ad-hud-sep"></div>

      <div class="ad-hud-zoom" role="group" aria-label="Zoom">
        <button class="ad-hud-zoom-btn" id="btn-zoom-out" aria-label="Zoom out">
          <i class="ph ph-minus"></i>
        </button>
        <button class="ad-hud-zoom-btn" id="btn-zoom-in" aria-label="Zoom in">
          <i class="ph ph-plus"></i>
        </button>
        <button class="ad-hud-zoom-btn" id="btn-zoom-reset" aria-label="Reset zoom">
          <i class="ph ph-corners-out"></i>
        </button>
      </div>
    </div>

    <!-- ACTIVE FILTER CHIPS -->
    <div class="ad-filter-active-bar" id="active-filters-bar" hidden></div>

    <!-- BOTTOM SHEET OVERLAY -->
    <div class="ad-sheet-overlay" id="sheet-overlay"></div>

    <!-- BOTTOM SHEET (results) -->
    <section class="ad-sheet lg-surface" id="results-sheet" aria-label="Job listings" hidden>
      <div class="ad-sheet-header">
        <div class="ad-sheet-title-group">
          <h2 class="ad-sheet-title" id="sheet-title">Jobs</h2>
          <div class="ad-sheet-breadcrumb" id="sheet-breadcrumb"></div>
        </div>
        <button class="ad-sheet-close" id="btn-sheet-close" aria-label="Close results">
          <i class="ph ph-x"></i>
        </button>
      </div>
      <div class="ad-sheet-body" id="sheet-body"></div>
    </section>

    <!-- FILTER DRAWER -->
    <div class="ad-filter-drawer lg-surface" id="filter-drawer" role="dialog" aria-modal="true" aria-label="Filters">
      <div class="ad-filter-header">
        <h3>Filters</h3>
        <button class="ad-filter-close" id="btn-close-filter" aria-label="Close filters">
          <i class="ph ph-x"></i>
        </button>
      </div>
      <div class="ad-filter-body" id="filter-body"></div>
      <div class="ad-filter-actions">
        <button class="ad-btn-ghost" id="btn-clear-filters">Clear All</button>
        <button class="ad-btn-primary" id="btn-apply-filters">Apply</button>
      </div>
    </div>
  </div>

  <!-- liquid-glass JS (5-layer optical glass engine) -->
  <script src="/liquid-glass.js"></script>

  <!-- Phosphor icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- App bootstrap -->
  <script type="module" src="js/india-map/app.js"></script>
</body>
</html>

<body class="map-entry">
  <nav class="top-nav" aria-label="Primary site navigation">
    <a class="nav-brand" href="/index.html" aria-label="About this project" title="About this project">
      <img class="nav-brand-mark nav-brand-v2" src="/assets/brand/v2-logo.png" alt="V² — V Square" width="32" height="32" decoding="async">

    </div>
  </nav>

  <main id="map-view">
    <h1 class="map-sr-only">India Map — active Central deputation vacancies</h1>
    <div class="map-container" id="mapContainer">
      <div class="map-header">
        <button id="btn-back" class="map-back-btn" aria-label="Back to India" hidden>
          <span>‹</span>
          <span>Back to India</span>
        </button>
        <button id="stateListBtn" class="map-state-list-btn" type="button" hidden></button>
        <div class="map-counter" id="mapCounter">
          <span class="map-counter-label">Active Vacancies</span>
          <span class="map-counter-value" id="mapCounterValue">—</span>
        </div>
      </div>
      <div class="map-svg-wrap" id="mapSvgWrap"></div>
      <!-- The open state's name, beside the state (see showStateTitle) -->
      <h2 class="map-state-title" id="mapStateTitle" hidden></h2>
      <div class="map-tooltip" id="mapTooltip" hidden>
        <div class="map-tooltip-name" id="mapTooltipName"></div>
        <div class="map-tooltip-count" id="mapTooltipCount"></div>
        <div class="map-tooltip-meta" id="mapTooltipMeta"></div>
      </div>
      <div id="mapAnnounce" aria-live="polite" class="map-sr-only"></div>
      <div class="map-controls">
        <div class="map-zoom-controls">
          <button id="zoomInBtn" class="map-zoom-btn" aria-label="Zoom in">+</button>
          <button id="zoomOutBtn" class="map-zoom-btn" aria-label="Zoom out">&minus;</button>
          <button id="zoomResetBtn" class="map-zoom-btn" aria-label="Reset view">&#8962;</button>
        </div>
      </div>
    </div>

    <!-- District listings modal -->
    <dialog id="modal" class="map-modal" aria-labelledby="modalTitle">
      <div class="map-modal-header">
        <h3 id="modalTitle"></h3>
        <button class="map-modal-close" aria-label="Close">&times;</button>
      </div>
      <div id="modalBody" class="map-modal-body"></div>
    </dialog>
  </main>

# AI-search safeguards behind the NIC-compatible Oracle ingress.
# The public api.alldeputations.com A record stays on Oracle. Only its
# semantic-search path forwards to this Worker; other API traffic is unchanged.
# See ../oracle-proxy/ and ../../EGRESS-RECOVERY.md before deploying.
name = "sb-proxy"
account_id = "aa6fca8ba721498e8ab8ebe8141f08d1"
main = "worker.js"
compatibility_date = "2026-07-31"
workers_dev = true
preview_urls = false

[observability]
enabled = true
redact_query_string = true

[observability.traces]
enabled = true

[vars]
# Roll out only after production snapshot verification; legacy clients fall
# back to their public JSON when the retired bulk endpoint returns 410.
BLOCK_PUBLIC_VACANCIES = "true"
DISABLE_PUBLIC_LIVE = "false"

[[ratelimits]]
name = "SEARCH_RATE_LIMITER"
namespace_id = "20261017"
simple = { limit = 60, period = 60 }

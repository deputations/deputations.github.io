name: Build deputation data

on:
  workflow_dispatch:
  schedule:
    - cron: "35 3 * * *" # ~09:05 IST daily
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/build-data.yml"

permissions:
  contents: write
  id-token: write

jobs:
  build-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build data files
        env:
          # Primary source: Supabase REST (live, where admin approvals land).
          # Fallback: Google Sheet (legacy, where vacancies used to be hand-
          # entered) — read by build_data.py only when Supabase returns 0 rows
          # or errors. Both sources must be present in the GitHub Actions
          # secret store; build_data.py fails loudly if neither works.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python scripts/build_data.py

      - name: Install Chromium for link previews
        run: python -m playwright install --with-deps chromium

      - name: Render notification link previews
        run: python scripts/build_link_previews.py

      - name: Build sitemap (P2-3)
        # Regenerate sitemap.xml from the freshly-dumped vacancies.json so
        # the search engines can discover per-vacancy pages (P2-3) and the
        # canonical clean-URL shape (P2-2). Runs before the commit step so
        # the new sitemap is part of the same daily commit.
        run: python scripts/build_sitemap.py

      - name: Build OG images (P2-4)
        # Generate one 1200x630 PNG per vacancy into ../og/. The Astro
        # workflow (which runs on push to astro/ branch) copies them
        # into astro/public/og/ for the build. We don't commit these
        # files (Pillow-generated, would balloon git history); the
        # Astro workflow regenerates them every build.
        run: python scripts/build_og_images.py

      - name: Commit generated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json assets/previews
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: build deputation data"
            # The link-preview render can take ~15 min, during which another
            # workflow (e.g. build-defex) may push. Rebase-and-retry so we don't
            # lose the run to a non-fast-forward rejection.
            for attempt in 1 2 3 4 5; do
              git pull --rebase --autostash origin main \
                && git push && { echo "pushed on attempt $attempt"; break; }
              echo "push attempt $attempt failed; retrying in 10s"
              sleep 10
            done
            if [ $? -ne 0 ]; then
              echo "::error::Could not push after 5 attempts"
              exit 1
            fi
          fi

      # Mirror data + assets onto the gh-pages branch so Astro rebuilds pick
      # up the freshest data without waiting on the next astro-build run.
      # Cheap, separate step: only runs if there were data changes this run.
      - name: Mirror data onto gh-pages
        if: success()
        run: |
          # Reset to a clean checkout of gh-pages, overlay data/ + assets/,
          # commit if anything actually changed. Force-push safely because
          # the only writer is this workflow.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin gh-pages || true
          git worktree add /tmp/ghpages gh-pages 2>/dev/null \
            || git worktree add --detach /tmp/ghpages origin/gh-pages 2>/dev/null \
            || (git worktree prune; git branch -D gh-pages 2>/dev/null; git worktree add --detach -b gh-pages /tmp/ghpages origin/main)

          mkdir -p /tmp/ghpages/data /tmp/ghpages/assets/previews
          cp -f data/*.json /tmp/ghpages/data/ 2>/dev/null || true
          cp -rf assets/previews/. /tmp/ghpages/assets/previews/ 2>/dev/null || true
          cp -f feed.xml /tmp/ghpages/feed.xml 2>/dev/null || true

          cd /tmp/ghpages
          git add data/ assets/ feed.xml 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): mirror fresh dump"
            for attempt in 1 2 3 4 5; do
              git push origin gh-pages && { echo "data mirrored on attempt $attempt"; exit 0; }
              echo "data-mirror attempt $attempt failed; retrying in 10s"
              sleep 10
            done
            echo "::error::data mirror push failed"
            exit 1
          else
            echo "gh-pages data already up to date"
          fi

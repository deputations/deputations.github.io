name: Build deputation data

on:
  workflow_dispatch:
  schedule:
    - cron: "35 3 * * *" # ~09:05 IST daily
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/build-data.yml"

permissions:
  contents: write
  id-token: write

jobs:
  build-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build data files
        env:
          # Primary source: Supabase REST (live, where admin approvals land).
          # Fallback: Google Sheet (legacy, where vacancies used to be hand-
          # entered) — read by build_data.py only when Supabase returns 0 rows
          # or errors. Both sources must be present in the GitHub Actions
          # secret store; build_data.py fails loudly if neither works.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python scripts/build_data.py

      - name: Install Chromium for link previews
        run: python -m playwright install --with-deps chromium

      - name: Render notification link previews
        run: python scripts/build_link_previews.py

      - name: Commit generated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json assets/previews
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: build deputation data"
            # The link-preview render can take ~15 min, during which another
            # workflow (e.g. build-defex) may push. Rebase-and-retry so we don't
            # lose the run to a non-fast-forward rejection.
            for attempt in 1 2 3 4 5; do
              git pull --rebase --autostash origin main \
                && git push && { echo "pushed on attempt $attempt"; exit 0; }
              echo "push attempt $attempt failed; retrying in 10s"
              sleep 10
            done
            echo "::error::Could not push after 5 attempts"
            exit 1
          fi

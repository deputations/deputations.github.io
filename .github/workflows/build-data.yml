name: Build deputation data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *" # publish approved edits within roughly ten minutes
    - cron: "35 3 * * *" # 09:05 IST; reclassify deadlines even without edits
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/build-data.yml"]

permissions:
  contents: write
  pages: write

concurrency:
  group: public-vacancy-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.stale.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check whether the public snapshot is stale
        id: stale
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE_BUILD: ${{ github.event_name != 'schedule' || github.event.schedule == '35 3 * * *' }}
        run: python scripts/snapshot_staleness.py
      - name: Install critical exporter dependencies only
        if: steps.stale.outputs.changed == 'true'
        run: pip install pandas==2.2.3 python-dateutil==2.9.0.post0
      - name: Export and validate public snapshots
        if: steps.stale.outputs.changed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/build_data.py
      - name: Publish validated artifacts
        if: steps.stale.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vacancies.json data/meta.json data/filters.json data/stats.json data/vacancies-manifest.json data/snapshots feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish verified vacancy snapshot"
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                pushed=true
                break
              fi
              sleep 10
            done
            if [ "$pushed" != true ]; then
              echo "::error::Publication push failed; preserve last good production snapshot"
              exit 1
            fi
          fi
      - name: Explicitly request a Pages build after the bot commit
        if: steps.stale.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Verify the actual production publication
        if: steps.stale.outputs.changed == 'true'
        run: python scripts/verify_publication.py --attempts 15
      - name: Record that the snapshot is current
        if: steps.stale.outputs.changed != 'true'
        run: echo "Public vacancy snapshot already matches the latest Supabase update." >> "$GITHUB_STEP_SUMMARY"
      - name: Publication failure summary
        if: failure()
        run: |
          echo "::error::Snapshot publication failed or deployment is pending. Inspect before changing database grants."
          echo "Snapshot publication failed. Preserve the last good version and check the production manifest. Optional enrichment did not gate this publication." >> "$GITHUB_STEP_SUMMARY"

  enrichment:
    needs: publish
    if: needs.publish.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build optional link previews
        run: python scripts/build_link_previews.py
      - name: Build sitemap and images
        run: |
          python scripts/build_sitemap.py
          python scripts/build_og_images.py
      - name: Publish optional public assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/previews data/link_previews.json sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh optional vacancy assets"
            git pull --rebase origin main
            git push
          fi
      - name: Build embeddings after snapshot publication
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/build_embeddings.py || {
            ec=$?
            if [ "$ec" -eq 3 ]; then
              echo "::warning::Embeddings rate-limited; public snapshot already published"
            else
              exit "$ec"
            fi
          }

name: Smoke tests

on:
  pull_request:
    paths:
      - "**.html"
      - "**/*.js"
      - "tests/**"
      - ".github/workflows/smoke-tests.yml"
      - "scripts/requirements.txt"
      - "scripts/verify_admin.py"
      - "data/vacancies.json"
      - "data/vacancies-manifest.json"
      - "scripts/**"
      - "supabase/**"
      - "workers/**"
      - "data/defex/**"
  push:
    branches: [main]
    paths:
      - "**.html"
      - "**/*.js"
      - "tests/**"
      - "data/vacancies.json"
      - "data/vacancies-manifest.json"
      - "scripts/**"
      - "supabase/**"
      - "workers/**"
      - "data/defex/**"
  workflow_dispatch:
  schedule:
    # 04:47 UTC ~= 10:17 IST. Off-cycle from build-data (03:35) so data drift
    # shows up in the morning report, not in a race with the daily rebuild.
    - cron: "47 4 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: |
          pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium

      # PR 3: full suite — all pages covered.
      - name: Run pytest suite
        run: python -m pytest tests/ -v --tb=short --maxfail=1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Public snapshot and map data checks
        run: |
          node --test tests/test_public_data.js
          node --test tests/test_public_proxy.cjs
          node --test workers/sb-proxy/worker.test.js
          node tests/test_india_map_data.js
          npm ci --prefix tests/sql --ignore-scripts --no-audit --no-fund
          node --test tests/test_vacancy_access.cjs

      - name: Validate proxy configuration without deployment
        working-directory: workers/sb-proxy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/proxy-build"

      # PR 4: drive the authenticated admin-ingest flow. Exercises Pack A
      # (401 -> refresh -> retry), Pack B (lazy editors, pager) and Pack E
      # (filtered bulk actions). Shares `tests/pages/{serve,route_helpers}.py`
      # with the smoke suite, so this also acts as a smoke check that the
      # shared helpers stay importable.
      - name: Verify admin-ingest (authenticated flows)
        run: python scripts/verify_admin.py
        continue-on-error: false

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failures-${{ github.run_id }}
          path: |
            tests/_artifacts/**
            _verify/**
          retention-days: 7

      # NB: there is deliberately no HTML-report upload. The step that used to
      # live here pointed at tests/_artifacts/report.html, which nothing ever
      # writes (pytest-html isn't a dependency), so every single run ended on a
      # "No files were found with the provided path" warning. The trace zips and
      # failure screenshots in the artifact above are what triage actually uses.
